# Sonde temporaire : exploiter la capture archivée de la base ASAM.
#
# Inventaire fait : une seule capture substantielle existe, celle du
# 27/09/2023 à l'adresse officielle avec « filter=none » — la base entière,
# 1,39 Mo compressés. Les autres captures sont de petites réponses annexes.
#
# Ce passage la décompresse et en lit la structure, pour savoir ce qu'on
# peut en tirer exactement.
#
# Ce fichier est jetable : il disparaît dès la source exploitée.
name: Sonde ASAM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/asam-sonde.yml"

jobs:
  sonder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Décompresser et lire la capture
        # Une sonde explore : un essai qui échoue est un résultat, pas une
        # raison d'interrompre les suivants.
        continue-on-error: true
        run: |
          set +e
          mkdir -p sonde
          R=sonde/asam-sonde.txt
          : > "$R"

          # « --compressed » : sans lui, l'archive rend l'octet brut tel qu'il
          # a été stocké — gzip compris — et le fichier paraît illisible.
          U='https://web.archive.org/web/20230927174507id_/https://msi.nga.mil/api/publications/asam?filter=none&sort=date&output=html'
          curl -sL --compressed -m 300 "$U" -o /tmp/asam.html

          {
            echo "═══ capture du 27/09/2023"
            echo "poids : $(wc -c < /tmp/asam.html) octets"
            echo "type  : $(file -b /tmp/asam.html)"
            echo "<tr>  : $(grep -c -o '<tr' /tmp/asam.html)"
            echo "<td>  : $(grep -c -o '<td' /tmp/asam.html)"
            echo
            echo "─── 2000 premiers caractères"
            head -c 2000 /tmp/asam.html
            echo
            echo "─── 600 derniers caractères"
            tail -c 600 /tmp/asam.html
            echo
          } >> "$R"

          # Certaines réponses « output=html » de la NGA sont en fait du JSON
          # servi tel quel : on vérifie plutôt que de le supposer.
          echo "═══ est-ce du JSON malgré tout ?" >> "$R"
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync("/tmp/asam.html", "utf8");
            try {
              const c = JSON.parse(t);
              const tab = Array.isArray(c) ? c : Object.values(c).find(Array.isArray);
              console.log("JSON valide, " + (tab ? tab.length + " entrées" : "sans tableau"));
              if (tab) console.log("champs : " + Object.keys(tab[0]).join(", "));
            } catch (e) {
              console.log("non : " + e.message.slice(0, 120));
            }
          ' >> "$R" 2>&1

      - name: Déposer le résultat sur la branche
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sonde/asam-sonde.txt
          git commit -m "Sonde ASAM : relevé brut" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
