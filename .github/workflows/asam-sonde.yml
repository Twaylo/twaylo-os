# Sonde temporaire : retrouver l'adresse actuelle de l'API ASAM.
#
# Premier passage : le code du site appelle bien « publications/asam? », mais
# le préfixe « /api/ » répond 404. Ce passage-ci extrait le contexte autour de
# l'appel dans le paquet JavaScript, pour lire l'adresse complète telle que la
# page la construit — préfixe et paramètres compris.
#
# Ce fichier est jetable : il disparaît dès l'adresse trouvée.
name: Sonde ASAM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/asam-sonde.yml"

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - name: Extraire l'appel réel depuis le paquet JavaScript
        run: |
          curl -s -m 60 https://msi.nga.mil/Piracy -o /tmp/piracy.html
          paquet=$(grep -o '/static/js/main[^"]*\.js' /tmp/piracy.html | head -1)
          echo "paquet : $paquet"
          curl -s -m 120 "https://msi.nga.mil$paquet" -o /tmp/b.js
          echo "taille : $(wc -c < /tmp/b.js) octets"
          echo

          echo "═══ contexte autour de « publications/asam »"
          grep -o -E '.{260}publications/asam.{400}' /tmp/b.js | head -5
          echo

          echo "═══ contexte autour de « getASAM »"
          grep -o -E 'getASAM.{500}' /tmp/b.js | head -3
          echo

          echo "═══ bases d'API déclarées dans le paquet"
          grep -o -E '"[^"]*api[^"]*"' /tmp/b.js | sort -u | head -40
          echo

          echo "═══ toutes les URL absolues vers nga.mil"
          grep -o -E 'https?://[a-z0-9.-]*nga[a-z0-9.-]*(/[a-z0-9/_.-]*)?' /tmp/b.js | sort -u | head -40

      - name: Essayer les préfixes plausibles
        run: |
          essayer() {
            code=$(curl -s -o /tmp/r -w '%{http_code}' -m 60 "$1" || echo 000)
            echo "─── $code  $(wc -c < /tmp/r)o  $1"
            head -c 300 /tmp/r; echo; echo
          }

          # Le service de publications est peut-être servi sous un autre nom
          # que « api » — on teste les préfixes courants de la plateforme MSI.
          for prefixe in \
            "https://msi.nga.mil/api/publications/asam" \
            "https://msi.nga.mil/publications/asam" \
            "https://msi.nga.mil/api/msi/publications/asam" \
            "https://msi.nga.mil/msi/publications/asam" \
            "https://msi.nga.mil/api/v1/publications/asam" \
            "https://msi.nga.mil/api/publications/asam/areas"
          do
            essayer "$prefixe?output=json"
          done
