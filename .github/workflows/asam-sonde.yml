# Sonde temporaire : comprendre comment l'API ASAM s'atteint aujourd'hui.
#
# Acquis des passages précédents :
#   · le site appelle bien « publications/asam », via une base « /api/ » ;
#   · cette adresse répond 404, y compris « publications/asam/areas » que
#     l'application appelle elle-même au chargement ;
#   · le paquet contient « /api/auth/token » et la page charge un reCAPTCHA.
#
# Hypothèse à vérifier : l'API réclame désormais un jeton, ou un en-tête que
# curl n'envoie pas. Ce passage extrait le code d'appel et essaie les variantes.
#
# Le résultat est écrit dans un fichier commité sur la branche : les journaux
# GitHub se lisent par la fin et tronquent, un fichier se lit en entier.
#
# Ce fichier est jetable : il disparaît dès la source atteinte.
name: Sonde ASAM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/asam-sonde.yml"

jobs:
  sonder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sonder
        run: |
          mkdir -p sonde
          R=sonde/asam-sonde.txt
          : > "$R"

          curl -s -m 60 https://msi.nga.mil/Piracy -o /tmp/piracy.html
          paquet=$(grep -o '/static/js/main[^"]*\.js' /tmp/piracy.html | head -1)
          curl -s -m 120 "https://msi.nga.mil$paquet" -o /tmp/b.js
          echo "paquet : $paquet ($(wc -c < /tmp/b.js) octets)" >> "$R"

          section() { printf '\n═══ %s\n' "$1" >> "$R"; }

          # --- Comment l'application construit ses appels -------------------
          section "définition de fetchData"
          grep -o -E '.{100}fetchData\s*[=:(].{700}' /tmp/b.js | head -4 >> "$R"

          section "contexte de /api/auth/token"
          grep -o -E '.{400}api/auth/token.{700}' /tmp/b.js | head -3 >> "$R"

          section "contexte de queryResults"
          grep -o -E '.{200}queryResults.{600}' /tmp/b.js | head -4 >> "$R"

          section "en-têtes posés par l'application"
          grep -o -E '.{120}(Authorization|X-API|apiKey|Bearer|recaptcha|captcha).{300}' /tmp/b.js \
            | head -8 >> "$R"

          # --- Ce que le serveur répond vraiment ----------------------------
          essayer() {
            nom="$1"; shift
            code=$(curl -s -o /tmp/r -w '%{http_code}' -m 60 "$@" || echo 000)
            printf '\n─── %s\n    %s  %so\n' "$nom" "$code" "$(wc -c < /tmp/r)" >> "$R"
            head -c 400 /tmp/r >> "$R"; echo >> "$R"
          }

          section "réponses du serveur"
          B=https://msi.nga.mil

          essayer "areas nu" "$B/api/publications/asam/areas"
          essayer "areas + entêtes navigateur" "$B/api/publications/asam/areas" \
            -H "Referer: $B/Piracy" -H "Origin: $B" \
            -H "Accept: application/json, text/plain, */*" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          essayer "jeton (GET)"  "$B/api/auth/token"
          essayer "jeton (POST)" -X POST "$B/api/auth/token"
          essayer "config"       "$B/api/application/config"
          essayer "asam filter=none" "$B/api/publications/asam?filter=none&output=json"
          essayer "asam annee 2025" "$B/api/publications/asam?filter=none&year=2025&output=json"
          essayer "queryResults" "$B/queryResults?publications/asam?filter=none&sort=date&output=json"

          # --- La base est-elle proposée en téléchargement ? ----------------
          section "ASAM parmi les publications téléchargeables"
          grep -o -E '.{200}[Aa][Ss][Aa][Mm].{200}' /tmp/piracy.html | head -5 >> "$R"
          essayer "liste des publications" "$B/api/publications/stored-pubs"

          echo "──── fin"
          wc -l "$R"

      - name: Déposer le résultat sur la branche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sonde/asam-sonde.txt
          git commit -m "Sonde ASAM : relevé brut" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
