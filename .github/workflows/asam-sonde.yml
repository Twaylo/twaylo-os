# Sonde temporaire : où est passée la base ASAM ?
#
# Acquis : l'API publique de la NGA marche (config et stored-pubs répondent
# 200 sans authentification), mais tous les chemins « asam » répondent 404.
# Ce n'est donc pas un problème de jeton : ces endpoints ne sont plus servis.
#
# Deux pistes restantes, testées ici :
#   1. la liste des publications téléchargeables contient peut-être ASAM
#      sous forme de fichier ;
#   2. la page appelle une fonction getCDN() — les appels d'API passent
#      peut-être par une autre base que « /api/ ».
#
# Ce fichier est jetable : il disparaît dès la source atteinte.
name: Sonde ASAM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/asam-sonde.yml"

jobs:
  sonder:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sonder
        run: |
          mkdir -p sonde
          R=sonde/asam-sonde.txt
          : > "$R"
          B=https://msi.nga.mil

          section() { printf '\n═══ %s\n' "$1" >> "$R"; }

          # --- 1. La page elle-même, en entier -----------------------------
          # 9 Ko : assez petit pour être lu intégralement, et c'est là que
          # vit getCDN().
          curl -s -m 60 "$B/Piracy" -o sonde/piracy.html

          paquet=$(grep -o '/static/js/main[^"]*\.js' sonde/piracy.html | head -1)
          curl -s -m 120 "$B$paquet" -o /tmp/b.js

          section "définition complète de fetchData"
          grep -o -E 'fetchData[^}]{0,80}\}[^}]{0,400}' /tmp/b.js | head -6 >> "$R"
          grep -o -E '.{300}e\.ok\?e\.json\(\).{200}' /tmp/b.js | head -3 >> "$R"

          # --- 2. ASAM dans les publications téléchargeables ----------------
          section "ASAM dans stored-pubs"
          curl -s -m 120 "$B/api/publications/stored-pubs" -o /tmp/pubs.json
          echo "taille : $(wc -c < /tmp/pubs.json) octets" >> "$R"
          grep -o -i -E '.{150}(asam|anti-shipping|antishipping|piracy).{250}' /tmp/pubs.json \
            | head -12 >> "$R"

          # --- 3. Chemins alternatifs --------------------------------------
          essayer() {
            code=$(curl -s -o /tmp/r -w '%{http_code}' -m 60 "$1" || echo 000)
            printf '\n─── %s  %so  %s\n' "$code" "$(wc -c < /tmp/r)" "$1" >> "$R"
            head -c 250 /tmp/r >> "$R"; echo >> "$R"
          }

          section "chemins alternatifs"
          for chemin in \
            "api/publications/asam" \
            "api/publications/ASAM" \
            "api/publications/asams" \
            "api/publications/asam-query" \
            "api/publications/anti-shipping" \
            "api/publications/antishipping" \
            "api/publications/piracy" \
            "api/piracy" \
            "api/asam" \
            "api/publications/asam/query" \
            "api/publications/query/asam"
          do
            essayer "$B/$chemin?output=json"
          done

          # --- 4. Ce que l'API expose réellement ---------------------------
          # Spring renvoie 404 avec le chemin demandé : en interrogeant la
          # racine et les voisins connus, on cerne ce qui existe encore.
          section "voisins connus de l'API"
          for chemin in \
            "api/publications/stored-nav-pubs" \
            "api/publications/world-port-index?output=json" \
            "api/publications/radio-navaids/areas" \
            "api/publications/broadcast-warn?output=json" \
            "api/application/config"
          do
            essayer "$B/$chemin"
          done

          echo "relevé : $(wc -c < "$R") octets"

      - name: Déposer le résultat sur la branche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sonde/asam-sonde.txt sonde/piracy.html
          git commit -m "Sonde ASAM : relevé brut" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
